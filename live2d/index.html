<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Live2D 체험 | 단청</title><link rel="stylesheet" href="./viewer.css"><style>body.embed{background:transparent}body.embed .layout{padding:0;max-width:none}body.embed header{display:none}body.embed .viewer{box-shadow:none}body.embed .foot{display:none}body.embed .controls{margin-top:14px}body.embed #stage{height:510px;min-height:350px}@media(max-width:720px){body.embed #stage{height:480px;min-height:330px}body.embed .controls{gap:10px}}</style></head><body><main class="layout"><header><a href="../" class="back">← 포트폴리오로</a><span class="eyebrow">DANCHUNG · LIVE2D</span><h1>Live2D 체험</h1><p>모델을 직접 움직이고 다양한 표정을 확인해 보세요.</p></header><div class="viewer"><div id="stage" role="img" aria-label="Live2D 모델 체험 화면"><div id="notice" class="notice">모델 파일을 추가하면 이곳에 표시됩니다.<small>live2d/models/sample/ 폴더와 config.json을 확인해 주세요.</small></div></div><div class="hint" id="hint">PC: 마우스 이동으로 시선 추적 · 드래그로 위치 이동 · 휠 확대/축소<br>모바일: 터치로 시선 추적 · 두 손가락으로 확대/축소</div></div><aside class="controls"><section><h2>표정 체험</h2><div id="expressions" class="buttons"><span class="muted">모델을 불러오면 표정 버튼이 나타납니다.</span></div></section><section><h2>모델 보기</h2><div class="buttons" id="views"><button data-view="full" class="active">전신</button><button data-view="upper">반신</button><button data-view="face">얼굴 확대</button></div></section><section><h2>설정</h2><label class="toggle"><input id="tracking" type="checkbox" checked> 마우스 / 터치 따라 움직이기</label><button id="reset">위치·표정 초기화</button></section><p class="foot">실제 체험 기능은 공개 가능한 Cubism 4 모델 파일이 필요합니다.</p></aside></main><script src="https://cdn.jsdelivr.net/npm/pixi.js@6.5.10/dist/browser/pixi.min.js"></script><script src="./lib/live2dcubismcore.min.js"></script><script src="https://cdn.jsdelivr.net/npm/pixi-live2d-display@0.4.0/dist/cubism4.min.js"></script><script>if(new URLSearchParams(location.search).has("embed"))document.body
